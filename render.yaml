# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: turbo-rally
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    # plain node (no npm/tsx wrapper processes) with a heap cap that fits the free 512MB instance
    startCommand: node --max-old-space-size=256 dist-server/server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_BRAND_MODE
        value: real
